<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>buildlog</title>
<meta name="description" content="Things I've built and shipped.">
<style>
  :root {
    --accent: #ff6600;
    --page: #f6f6ef;
    --text: #000000;
    --muted: #828282;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 8px 0;
    background: #ffffff;
    color: var(--text);
    font-family: Verdana, Geneva, sans-serif;
    font-size: 10pt;
  }
  .wrap {
    width: 85%;
    max-width: 1100px;
    margin: 0 auto;
    background: var(--page);
  }
  header {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 2px 4px;
    background: var(--accent);
  }
  .logo {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 18px;
    height: 18px;
    border: 1px solid #ffffff;
    color: #ffffff;
    font-weight: bold;
    font-size: 11px;
  }
  .brand { font-weight: bold; color: var(--text); text-decoration: none; }
  .tagline { color: var(--text); }
  ol {
    margin: 0;
    padding: 10px 4px 14px 0;
    list-style: none;
    counter-reset: item;
  }
  li {
    counter-increment: item;
    display: grid;
    grid-template-columns: 30px 1fr;
    padding: 4px 0 6px;
  }
  li::before {
    content: counter(item) ".";
    color: var(--muted);
    text-align: right;
    padding-right: 6px;
  }
  .title a { color: var(--text); text-decoration: none; }
  .title a:visited { color: var(--muted); }
  .site { color: var(--muted); font-size: 8pt; margin-left: 4px; }
  .sub {
    grid-column: 2;
    color: var(--muted);
    font-size: 7.5pt;
    margin-top: 3px;
    line-height: 1.5;
  }
  .sub a { color: var(--muted); text-decoration: none; }
  .sub a:hover { text-decoration: underline; }
  footer {
    border-top: 2px solid var(--accent);
    padding: 10px 4px 14px;
    text-align: center;
    color: var(--muted);
    font-size: 8pt;
  }
  footer a { color: var(--muted); }
  .empty { padding: 10px 34px; color: var(--muted); }
  @media (max-width: 750px) {
    body { padding: 0; }
    .wrap { width: 100%; }
    header .tagline { display: none; }
    .title { font-size: 11pt; }
    .site { display: block; margin: 2px 0 0; }
    .sub { font-size: 8.5pt; }
  }
</style>
</head>
<body>
  <div class="wrap">
    <header>
      <span class="logo">Z</span>
      <a class="brand" href="./">buildlog</a>
      <span class="tagline">| things I've built and shipped</span>
    </header>
    <main>
      <ol id="list"></ol>
      <noscript><p class="empty">Turn on JavaScript to see the projects.</p></noscript>
    </main>
    <footer>Zakeer SMD</footer>
  </div>
<script>
  function siteOf(url) {
    try {
      const u = new URL(url);
      const parts = u.pathname.split("/").filter(Boolean);
      return u.hostname === "github.com" && parts.length ? "github.com/" + parts[0] : u.hostname.replace(/^www\./, "");
    } catch (e) {
      return "";
    }
  }

  function link(href, text) {
    const a = document.createElement("a");
    a.href = href;
    a.textContent = text;
    a.rel = "noopener";
    return a;
  }

  function render(projects) {
    const list = document.getElementById("list");
    list.textContent = "";
    if (!projects.length) {
      list.outerHTML = '<p class="empty">No projects yet.</p>';
      return;
    }
    projects.forEach(function (p) {
      const li = document.createElement("li");

      const title = document.createElement("div");
      title.className = "title";
      title.appendChild(link(p.url, p.title));
      const site = document.createElement("span");
      site.className = "site";
      site.textContent = "(" + siteOf(p.url) + ")";
      title.appendChild(site);

      const sub = document.createElement("div");
      sub.className = "sub";
      const bits = [];
      if (p.stack && p.stack.length) bits.push(document.createTextNode(p.stack.join(" · ")));
      if (p.highlight) bits.push(document.createTextNode(p.highlight));
      bits.push(link(p.url, "repo"));
      if (p.demo) bits.push(link(p.demo, "demo"));
      bits.forEach(function (node, i) {
        if (i) sub.appendChild(document.createTextNode(" | "));
        sub.appendChild(node);
      });

      li.appendChild(title);
      li.appendChild(sub);
      list.appendChild(li);
    });
  }

  fetch("projects.json", { cache: "no-cache" })
    .then(function (r) { return r.json(); })
    .then(render)
    .catch(function () {
      document.getElementById("list").outerHTML = '<p class="empty">Projects could not be loaded.</p>';
    });
</script>
</body>
</html>
