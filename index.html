<style>
  :root {
    --accent: #ff6600;
    --page: #f6f6ef;
    --text: #000000;
    --muted: #5f5f5f;
    --soft: #828282;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 8px 0;
    background: var(--page);
    color: var(--text);
    font-family: Verdana, Geneva, sans-serif;
    font-size: 10pt;
  }
  .wrap {
    width: 85%;
    max-width: 1100px;
    margin: 0 auto;
    background: var(--page);
  }
  header {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 2px 4px;
    background: var(--accent);
  }
  .logo {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 18px;
    height: 18px;
    border: 1px solid #ffffff;
    color: #ffffff;
    font-weight: bold;
    font-size: 11px;
  }
  .brand { font-weight: bold; color: var(--text); text-decoration: none; }
  .tagline { color: var(--text); }
  ol {
    margin: 0;
    padding: 10px 4px 14px 0;
    list-style: none;
    counter-reset: item;
  }
  li {
    counter-increment: item;
    display: grid;
    grid-template-columns: 30px 1fr;
    padding: 5px 0 8px;
  }
  li::before {
    content: counter(item) ".";
    color: var(--soft);
    text-align: right;
    padding-right: 6px;
  }
  .title { font-size: 10.5pt; }
  .title a { color: var(--text); text-decoration: none; }
  .title a:hover { text-decoration: underline; }
  .title .name { font-weight: bold; }
  .sub {
    grid-column: 2;
    color: var(--muted);
    font-size: 8.5pt;
    margin-top: 4px;
    line-height: 1.6;
  }
  .sub .result { color: #333333; }
  .sub a { color: var(--muted); text-decoration: underline; }
  footer {
    border-top: 2px solid var(--accent);
    padding: 10px 4px 14px;
    text-align: center;
    color: var(--soft);
    font-size: 8pt;
  }
  .empty { padding: 10px 34px; color: var(--muted); }
  @media (max-width: 750px) {
    body { padding: 0; }
    .wrap { width: 100%; }
    header .tagline { display: none; }
    .title { font-size: 11pt; }
    .sub { font-size: 9pt; }
  }
</style>
</head>
<body>
  <div class="wrap">
    <header>
      <span class="logo">Z</span>
      <a class="brand" href="./">buildlog</a>
      <span class="tagline">| things I've built and shipped</span>
    </header>
    <main>
      <ol id="list"></ol>
      <noscript><p class="empty">Turn on JavaScript to see the projects.</p></noscript>
    </main>
    <footer>Zakeer SMD</footer>
  </div>
<script>
  function el(tag, cls, text) {
    const node = document.createElement(tag);
    if (cls) node.className = cls;
    if (text) node.textContent = text;
    return node;
  }

  function render(projects) {
    const list = document.getElementById("list");
    list.textContent = "";
    if (!projects.length) {
      list.outerHTML = '<p class="empty">No projects yet.</p>';
      return;
    }
    projects.forEach(function (p) {
      const li = el("li");

      const title = el("div", "title");
      const a = el("a");
      a.href = p.url;
      a.rel = "noopener";
      if (p.name) {
        a.appendChild(el("span", "name", p.name));
        a.appendChild(document.createTextNode(": " + p.title));
      } else {
        a.textContent = p.title;
      }
      title.appendChild(a);

      const sub = el("div", "sub");
      const bits = [];
      if (p.highlight) bits.push(el("span", "result", p.highlight));
      if (p.stack && p.stack.length) bits.push(document.createTextNode(p.stack.join(" · ")));
      if (p.year) bits.push(document.createTextNode(String(p.year)));
      if (p.demo) {
        const d = el("a", "", "demo");
        d.href = p.demo;
        d.rel = "noopener";
        bits.push(d);
      }
      bits.forEach(function (node, i) {
        if (i) sub.appendChild(document.createTextNode(" | "));
        sub.appendChild(node);
      });

      li.appendChild(title);
      if (bits.length) li.appendChild(sub);
      list.appendChild(li);
    });
  }

  fetch("projects.json", { cache: "no-cache" })
    .then(function (r) { return r.json(); })
    .then(render)
    .catch(function () {
      document.getElementById("list").outerHTML = '<p class="empty">Projects could not be loaded.</p>';
    });
</script>
</body>
</html>
